# @package _global_

type: sfm
work_dir: ${hydra:runtime.cwd}
data_base_dir: "${work_dir}/data/datasets/yp/${train_model}"
output_base_dir: "data/datasets/sfm_output/${train_model}"

match_type: "softmax"
enable_post_refine: True

overwrite_all: True
overwrite_coarse: True
overwrite_fine: True

use_global_ray: False
use_local_ray: True

ray:
  slurm: False
  n_workers: 2
  n_cpus_per_worker: 2
  n_gpus_per_worker: 0.5
  local_mode: False

dataset:
  max_num_kp3d: 15000

  data_dir: ${data_base_dir}
  top_k_obj: null
  num_seq: 1
  ids:
    # Test set of OnePose_LowTexture
    - '0000'
  exception_obj_names:
    -

  outputs_dir: ${output_base_dir}

network:
  detection: loftr
  matching: loftr

sfm:
  gen_cov_from: 'pose'
  down_ratio: 5
  gap: 3
  covis_num: 10
  min_rotation: 10

post_optim:
  coarse_recon_data:
    feature_track_assignment_strategy: 'greedy'
  optimizer:
    solver_type: 'SecondOrder'
    residual_mode: "geometry_error"
    optimize_lr:
      depth: 0.03

post_process:
  filter_bbox_before_filter_track_length: True
  skip_bbox_filter: False

verbose: True
disable_lightning_logs: True
